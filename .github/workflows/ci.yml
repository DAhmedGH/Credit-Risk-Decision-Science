name: credit-risk-fixtures
on: [push, pull_request]
jobs:
  fixture-checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_DB: credit_risk_dev
          POSTGRES_USER: credit_risk_app
          POSTGRES_PASSWORD: fixture_only_not_a_real_secret
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U credit_risk_app -d credit_risk_dev"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python scripts/environment_smoke.py
      - run: python scripts/phase2_smoke.py
      - run: python scripts/phase4_smoke.py
      - run: ruff check .
      - run: pytest -q
      - name: Isolated SQL fixture integration
        env:
          CREDIT_RISK_SQL_TEST: '1'
          POSTGRES_PASSWORD: fixture_only_not_a_real_secret
          POSTGRES_HOST_PORT: '55432'
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U credit_risk_app -d credit_risk_dev -c "ALTER DATABASE credit_risk_dev SET credit_risk.project = 'credit-risk-decision-science';"
          docker exec ${{ job.services.postgres.id }} psql -U credit_risk_app -d credit_risk_dev -c "ALTER DATABASE credit_risk_dev SET credit_risk.lifecycle = 'disposable-development';"
          pytest -q tests/test_database.py
